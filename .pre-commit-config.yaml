# Blocks commits that contain secrets. Installed automatically by chezmoi
# (run_once_after_install-repo-hooks.sh.tmpl); manually: pre-commit install.
# Gitleaks reads its rules from .gitleaks.toml. CI repeats the scan, so
# `git commit --no-verify` is still caught before merge.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
